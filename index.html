<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Question</title>
    <style>
        body {
            background-color: #fdf2f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .screen {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            display: none; 
            z-index: 100;
            position: relative;
        }

        .active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { color: #be123c; font-size: 1.8rem; }
        p { color: #4b5563; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-yes { background-color: #e11d48; color: white; font-size: 1.1rem; }
        .btn-yes:hover { background-color: #be123c; transform: scale(1.1); }

        .btn-no { background-color: #e5e7eb; color: #4b5563; position: relative; }

        /* Mega Rose Styling */
        .bg-rose {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            animation: roseBloom 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes roseBloom {
            from { transform: scale(0) rotate(0deg); opacity: 0; }
            to { transform: scale(var(--s)) rotate(var(--r)); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen active">
        <h1>Hey! 👋</h1>
        <p>I have a quick question for you...</p>
        <button class="btn-yes" onclick="nextScreen(2)">What is it?</button>
    </div>

    <div id="screen2" class="screen">
        <h1>Are you having a good day?</h1>
        <div class="btn-container">
            <button class="btn-yes" onclick="startRoseFlood()">Yes!</button>
            <button id="noBtn" class="btn-no" onmouseover="moveNo()" onclick="moveNo()">No</button>
        </div>
    </div>

    <div id="screen3" class="screen">
        <h1>Well, it's about to get better...</h1>
        <p>I sent you a literal garden of roses 🌹</p>
        <p style="font-size: 0.9rem; font-weight: bold; color: #be123c; margin-top: 15px;">Look at all that red! ✨</p>
    </div>

    <script>
        function nextScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen' + screenNum).classList.add('active');
        }

        function moveNo() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function startRoseFlood() {
            nextScreen(3);

            const numberOfRoses = 200; // Tons of roses

            for (let i = 0; i < numberOfRoses; i++) {
                setTimeout(() => {
                    const rose = document.createElement('div');
                    rose.className = 'bg-rose';
                    rose.innerHTML = '🌹';
                    
                    // Placement
                    rose.style.left = (Math.random() * 110 - 5) + 'vw';
                    rose.style.top = (Math.random() * 110 - 5) + 'vh';
                    
                    // Huge random scaling (2.0 to 5.0)
                    const randomScale = (Math.random() * 3 + 2); 
                    rose.style.setProperty('--s', randomScale);
                    rose.style.fontSize = '2rem'; 

                    // Random initial rotation
                    const randomRot = Math.random() * 360 + 'deg';
                    rose.style.setProperty('--r', randomRot);
                    
                    document.body.appendChild(rose);
                }, i * 10); // Very fast spawn
            }
        }
    </script>
</body>
</html>
