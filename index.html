<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Question</title>
    <style>
        body {
            background-color: #fdf2f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .screen {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
            display: none; /* Hidden by default */
        }

        .active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { color: #db2777; font-size: 1.8rem; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-yes { background-color: #f472b6; color: white; font-size: 1.1rem; }
        .btn-yes:hover { background-color: #db2777; transform: scale(1.1); }

        .btn-no { background-color: #e5e7eb; color: #4b5563; position: relative; }

        .rose-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen active">
        <h1>Hey! 👋</h1>
        <p>I have a quick question for you...</p>
        <button class="btn-yes" onclick="nextScreen(2)">What is it?</button>
    </div>

    <div id="screen2" class="screen">
        <h1>Are you having a good day?</h1>
        <div class="btn-container">
            <button class="btn-yes" onclick="nextScreen(3)">Yes!</button>
            <button id="noBtn" class="btn-no" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <div id="screen3" class="screen">
        <h1>Well, it's about to get better...</h1>
        <p>I sent you some digital roses 🌹</p>
        <div class="rose-grid">
            <span>🌹</span><span>🌹</span><span>🌹</span>
            <span>🌹</span><span>🌹</span><span>🌹</span>
            <span>🌹</span><span>🌹</span><span>🌹</span>
        </div>
        <p style="font-size: 0.8rem; color: #999; margin-top: 20px;">(Because why not?)</p>
    </div>

    <script>
        function nextScreen(screenNum) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            // Show the next one
            document.getElementById('screen' + screenNum).classList.add('active');
        }

        function moveNo() {
            const btn = document.getElementById('noBtn');
            // Make the button run away so she can't click "No" easily
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
